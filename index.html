<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Sertum</title>
  </head>
  <body>
    <div id="root">
      <!-- Always present: it owns the window drag region and reserves space
           for the macOS traffic lights, neither of which should depend on an
           optional tab strip being visible. -->
      <div class="titlebar" id="titlebar">
        <span class="titlebar-text" id="titlebar-text">Sertum</span>
      </div>

      <div class="tabstrip"></div>

      <div class="body">
        <aside class="sidebar">
          <div class="sidebar-head" id="sidebar-head">
            <span class="sb-title">Sessions</span>
            <span id="sidebar-count" class="sb-count">0</span>
            <button
              class="sb-find"
              id="sidebar-find"
              type="button"
              aria-label="Filter sessions"
              title="Filter sessions"
            >⌕</button>
            <span class="sb-search" id="sidebar-search" hidden>
              <span class="sb-search-icon" aria-hidden="true">⌕</span>
              <input
                id="sidebar-filter"
                type="text"
                autocomplete="off"
                spellcheck="false"
                aria-label="Filter sessions by name or folder"
                placeholder="Filter sessions"
              />
              <button
                class="sb-clear"
                id="sidebar-clear"
                type="button"
                aria-label="Clear filter"
                title="Clear filter"
              >×</button>
            </span>
          </div>
          <div id="sidebar-list"></div>
          <!-- Split button: the face starts a session with the agent you
               used last, the caret chooses a different one. -->
          <div class="sidebar-new-split">
            <button class="sidebar-new" id="sidebar-new" type="button">
              <span aria-hidden="true">＋</span> New session
            </button>
            <button
              class="sidebar-new-caret"
              id="sidebar-new-agent"
              type="button"
              aria-haspopup="menu"
              aria-label="Choose an agent"
              title="Start a session with a different agent"
            >⌄</button>
          </div>
        </aside>

        <div
          class="splitter"
          id="splitter"
          role="separator"
          aria-orientation="vertical"
          aria-label="Resize session list"
          tabindex="0"
        ></div>

        <section class="pane">
          <header class="pane-head" id="pane-head" style="display: none">
            <div class="pane-title" id="pane-title"></div>
            <div class="pane-actions">
              <!-- Design note 244: the layout picker hangs off this button, so
                   splitting is reachable without going through the menu bar. -->
              <button
                class="btn ghost pane-layout-btn"
                id="pane-layout"
                type="button"
                aria-haspopup="dialog"
                title="Pane layout  (⌘⌥L)"
              >▢ Single</button>
              <button class="btn ghost" disabled>Info</button>
              <button class="btn ghost" disabled>Diff</button>
              <button class="btn ghost" id="pane-stop" type="button">Stop</button>
              <button class="btn ghost" id="open-settings" type="button">
                Settings…
              </button>
            </div>
          </header>
          <div id="approval-host"></div>
          <div id="pane-host" style="flex: 1; display: flex; min-height: 0"></div>
        </section>
      </div>

      <footer class="statusbar">
        <div class="group" id="status-left"></div>
        <div class="group" id="status-right"></div>
      </footer>
    </div>
    <script type="module" src="/src/renderer.ts"></script>
  </body>
</html>
